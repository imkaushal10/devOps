name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # Job 1: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Test Frontend
        run: |
          cd frontend
          npm ci
          npm test

      - name: Test Product API
        run: |
          cd product-api
          pip install --upgrade pip
          pip install 'Werkzeug<3.0.0' 'Flask>=2.3.0,<4.0.0'
          pip install -r requirements.txt
          pytest tests/ -v --cov=src

      - name: Test Order API
        run: |
          cd order-api
          pip install --upgrade pip
          pip install 'Werkzeug<3.0.0' 'Flask>=2.3.0,<4.0.0'
          pip install -r requirements.txt
          pytest tests/ -v --cov=src

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()

  # Job 2: Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: NPM Audit
        run: |
          cd frontend
          npm audit --audit-level=moderate
        continue-on-error: true

      - name: Python Safety Check
        run: |
          pip install safety
          cd product-api && safety check -r requirements.txt || true
          cd ../order-api && safety check -r requirements.txt || true
        continue-on-error: true

  # Job 3: Build and Push Docker Images
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, security-scan]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Git Metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Build & Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:buildcache,mode=max

      - name: Build & Push Product API
        uses: docker/build-push-action@v4
        with:
          context: ./product-api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:${{ steps.meta.outputs.sha_short }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:buildcache,mode=max

      - name: Build & Push Order API
        uses: docker/build-push-action@v4
        with:
          context: ./order-api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:${{ steps.meta.outputs.sha_short }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:buildcache,mode=max

      - name: Scan Docker Images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # Job 4: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: http://staging.techcommerce.local

    steps:
      - uses: actions/checkout@v3

      - name: Create Kind Cluster (Staging)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: staging-cluster
          wait: 60s

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Load Docker Images into Kind
        run: |
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest --name staging-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest --name staging-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest --name staging-cluster

      - name: Deploy to Staging
        run: |
          cd k8s/staging
          kustomize edit set image \
            techcommerce-frontend=${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          kustomize edit set image \
            techcommerce-product-api=${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          kustomize edit set image \
            techcommerce-order-api=${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest
          kubectl apply -k .
          kubectl wait --for=condition=available --timeout=300s deployment --all -n techcommerce-staging

      - name: Post-deploy Checks
        run: |
          kubectl get deployments,pods,services -n techcommerce-staging

  # Job 5: Deploy to Production (Manual Approval)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://techcommerce.local

    steps:
      - uses: actions/checkout@v3

      - name: Create Kind Cluster (Production)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: production-cluster
          wait: 60s

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Backup Current State
        run: |
          mkdir -p backups
          kubectl get all --all-namespaces -o yaml > backups/backup-$(date +%Y%m%d-%H
