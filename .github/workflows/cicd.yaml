name: TechCommerce CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # -----------------------------
  # Job 1: Run Tests
  # -----------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Test Frontend
        run: |
          cd frontend
          npm ci
          npm test

      - name: Test Product API
        run: |
          cd product-api
          pip install --upgrade pip
          pip install 'Werkzeug<3.0.0' 'Flask>=2.3.0,<4.0.0'
          pip install -r requirements.txt
          pytest tests/ -v --cov=src

      - name: Test Order API
        run: |
          cd order-api
          pip install --upgrade pip
          pip install 'Werkzeug<3.0.0' 'Flask>=2.3.0,<4.0.0'
          pip install -r requirements.txt
          pytest tests/ -v --cov=src

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()

  # -----------------------------
  # Job 2: Security Scanning
  # -----------------------------
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run npm audit (Frontend)
        run: |
          cd frontend
          npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Safety (Python)
        run: |
          pip install safety
          cd product-api && safety check -r requirements.txt || true
          cd ../order-api && safety check -r requirements.txt || true
        continue-on-error: true

  # -----------------------------
  # Job 3: Build & Push Docker Images
  # -----------------------------
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Git metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Build & push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:buildcache,mode=max

      - name: Build & push Product API
        uses: docker/build-push-action@v4
        with:
          context: ./product-api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:${{ steps.meta.outputs.sha_short }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:buildcache,mode=max

      - name: Build & push Order API
        uses: docker/build-push-action@v4
        with:
          context: ./order-api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:${{ steps.meta.outputs.sha_short }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:buildcache,mode=max

      - name: Scan Docker images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          format: table
          exit-code: 0
          severity: "CRITICAL,HIGH"

      - name: Scan Product API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          format: table
          exit-code: 0
          severity: "CRITICAL,HIGH"

      - name: Scan Order API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest
          format: table
          exit-code: 0
          severity: "CRITICAL,HIGH"

  # -----------------------------
  # Job 4: Deploy to Staging (Auto)
  # -----------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: http://staging.techcommerce.local
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: staging-cluster
          wait: 60s

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Load images into Kind
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest --name staging-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest --name staging-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest --name staging-cluster

      - name: Update kustomize images
        run: |
          cd k8s/staging
          kustomize edit set image techcommerce-frontend=${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          kustomize edit set image techcommerce-product-api=${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          kustomize edit set image techcommerce-order-api=${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest

      - name: Apply manifests
        run: |
          kubectl apply -k k8s/staging

      - name: Wait for pods
        run: |
          kubectl wait --for=condition=ready pod -l app=frontend -n techcommerce-staging --timeout=300s || echo "Frontend not ready"
          kubectl wait --for=condition=ready pod -l app=product-api -n techcommerce-staging --timeout=300s || echo "Product API not ready"
          kubectl wait --for=condition=ready pod -l app=order-api -n techcommerce-staging --timeout=300s || echo "Order API not ready"

      - name: Verify deployments
        run: |
          kubectl get deployments,pods,services -n techcommerce-staging

  # -----------------------------
  # Job 5: Deploy to Production (Manual Approval + Rollback)
  # -----------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://techcommerce.local
      reviewers:
        - your-team-member
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Kind cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: production-cluster
          wait: 60s

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Load images
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest --name production-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest --name production-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest --name production-cluster

      - name: Update kustomize images
        run: |
          cd k8s/production
          kustomize edit set image techcommerce-frontend=${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          kustomize edit set image techcommerce-product-api=${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          kustomize edit set image techcommerce-order-api=${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest

      - name: Deploy manifests
        run: |
          kubectl apply -k k8s/production

      - name: Wait for pods
        run: |
          kubectl wait --for=condition=ready pod -l app=frontend -n techcommerce-production --timeout=300s || echo "Frontend not ready"
          kubectl wait --for=condition=ready pod -l app=product-api -n techcommerce-production --timeout=300s || echo "Product API not ready"
          kubectl wait --for=condition=ready pod -l app=order-api -n techcommerce-production --timeout=300s || echo "Order API not ready"

      - name: Rollback if failed
        if: failure()
        run: |
          kubectl rollout undo deployment/prod-frontend -n techcommerce-production
          kubectl rollout undo deployment/prod-product-api -n techcommerce-production
          kubectl rollout undo deployment/prod-order-api -n techcommerce-production
