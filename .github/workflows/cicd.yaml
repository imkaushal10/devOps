name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  # Job 1: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Test Frontend
        run: |
          cd frontend
          npm ci
          npm test

      - name: Test Product API
        run: |
          cd product-api
          pip install --upgrade pip
          pip install 'Werkzeug<3.0.0' 'Flask>=2.3.0,<4.0.0'
          pip install -r requirements.txt
          pytest tests/ -v --cov=src

      - name: Test Order API
        run: |
          cd order-api
          pip install --upgrade pip
          pip install 'Werkzeug<3.0.0' 'Flask>=2.3.0,<4.0.0'
          pip install -r requirements.txt
          pytest tests/ -v --cov=src

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()

  # Job 2: Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run npm audit (Frontend)
        run: |
          cd frontend
          npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Safety check (Python)
        run: |
          pip install safety
          cd product-api && safety check -r requirements.txt || true
          cd ../order-api && safety check -r requirements.txt || true
        continue-on-error: true

  # Job 3: Build and Push Docker Images
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, security-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:buildcache,mode=max

      - name: Build and push Product API
        uses: docker/build-push-action@v4
        with:
          context: ./product-api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:${{ steps.meta.outputs.sha_short }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:buildcache,mode=max

      - name: Build and push Order API
        uses: docker/build-push-action@v4
        with:
          context: ./order-api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest
            ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:${{ steps.meta.outputs.sha_short }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:buildcache,mode=max

      - name: Scan Frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Scan Product API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Scan Order API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  # Job 4: Deploy to Staging (Automatic)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: http://staging.techcommerce.local

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Kind Cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: staging-cluster
          wait: 60s

      - name: Verify cluster is running
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create Kind Cluster for Production
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: production-cluster
          wait: 60s

      - name: Verify cluster is running
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker images
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest

      - name: Load images into Kind cluster
        run: |
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest --name staging-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest --name staging-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest --name staging-cluster

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker images
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest

      - name: Load images into Kind cluster
        run: |
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest --name production-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest --name production-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest --name production-cluster
          echo "Images loaded successfully"

      - name: Update image tags
        run: |
          cd k8s/staging
          kustomize edit set image \
            techcommerce-frontend=${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          kustomize edit set image \
            techcommerce-product-api=${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          kustomize edit set image \
            techcommerce-order-api=${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest

      - name: Deploy to staging
        run: |
          kubectl apply -k k8s/staging
          echo "Staging deployment initiated"

      - name: Wait for deployments to be ready
        run: |
          kubectl wait --for=condition=available --timeout=300s \
            deployment/staging-frontend -n techcommerce-staging || echo "Frontend not ready"
          kubectl wait --for=condition=available --timeout=300s \
            deployment/staging-product-api -n techcommerce-staging || echo "Product API not ready"
          kubectl wait --for=condition=available --timeout=300s \
            deployment/staging-order-api -n techcommerce-staging || echo "Order API not ready"

      - name: Verify rollout status
        continue-on-error: true
        run: |
          kubectl rollout status deployment/staging-frontend -n techcommerce-staging --timeout=5m 2>&1 || echo "Frontend rollout failed or timed out"
          kubectl rollout status deployment/staging-product-api -n techcommerce-staging --timeout=5m 2>&1 || echo "Product API rollout failed or timed out"
          kubectl rollout status deployment/staging-order-api -n techcommerce-staging --timeout=5m 2>&1 || echo "Order API rollout failed or timed out"

      - name: Check deployment status
        run: |
          echo "=== Deployments ==="
          kubectl get deployments -n techcommerce-staging
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n techcommerce-staging
          echo ""
          echo "=== Services ==="
          kubectl get services -n techcommerce-staging

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          kubectl get pods -n techcommerce-staging
          echo "Smoke tests completed"

      - name: Save kubeconfig as artifact
        run: |
          kubectl config view --raw > staging-kubeconfig.yaml
          echo "Kubeconfig saved for debugging"

      - name: Upload kubeconfig
        uses: actions/upload-artifact@v4
        with:
          name: staging-kubeconfig
          path: staging-kubeconfig.yaml
          retention-days: 1

      - name: Notify deployment
        if: always()
        run: |
          echo "Staging deployment completed!"
          echo "Status: ${{ job.status }}"

  # Job 5: Deploy to Production (Manual Approval Required)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://techcommerce.local

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Kind Cluster for Production
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: production-cluster
          wait: 60s

      - name: Verify cluster is running
        run: |
          kubectl cluster-info
          kubectl get nodes
          echo "Production cluster created successfully"

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker images
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest

      - name: Load images into Kind cluster
        run: |
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest --name production-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest --name production-cluster
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest --name production-cluster

      - name: Create backup of current state
        run: |
          echo "Creating backup of production state..."
          mkdir -p backups
          kubectl get all --all-namespaces -o yaml > backups/backup-$(date +%Y%m%d-%H%M%S).yaml || echo "No existing resources to backup"

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: production-backup
          path: backups/
          retention-days: 30

      - name: Update image tags
        run: |
          cd k8s/production
          kustomize edit set image \
            techcommerce-frontend=${{ secrets.DOCKER_USERNAME }}/techcommerce-frontend:latest
          kustomize edit set image \
            techcommerce-product-api=${{ secrets.DOCKER_USERNAME }}/techcommerce-product-api:latest
          kustomize edit set image \
            techcommerce-order-api=${{ secrets.DOCKER_USERNAME }}/techcommerce-order-api:latest

      - name: Deploy to production
        id: deploy
        run: |
          kubectl apply -k k8s/production
          echo "Production deployment initiated"
          echo ""
          echo "=== Initial deployment status ==="
          sleep 10
          kubectl get all -n techcommerce-production

      - name: Debug production pods
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n techcommerce-production -o wide
          echo ""
          echo "=== Describe Pods ==="
          kubectl describe pods -n techcommerce-production
          echo ""
          echo "=== Events ==="
          kubectl get events -n techcommerce-production --sort-by='.lastTimestamp'

      - name: Wait for deployments to be ready
        continue-on-error: true
        run: |
          kubectl wait --for=condition=available --timeout=300s \
            deployment/prod-frontend -n techcommerce-production 2>&1 || echo "Frontend not ready"
          kubectl wait --for=condition=available --timeout=300s \
            deployment/prod-product-api -n techcommerce-production 2>&1 || echo "Product API not ready"
          kubectl wait --for=condition=available --timeout=300s \
            deployment/prod-order-api -n techcommerce-production 2>&1 || echo "Order API not ready"

      - name: Check pod logs if not ready
        run: |
          echo "=== Frontend Logs ==="
          kubectl logs -n techcommerce-production -l app=frontend --tail=100 || echo "No logs available"
          echo ""
          echo "=== Product API Logs ==="
          kubectl logs -n techcommerce-production -l app=product-api --tail=100 || echo "No logs available"
          echo ""
          echo "=== Order API Logs ==="
          kubectl logs -n techcommerce-production -l app=order-api --tail=100 || echo "No logs available"

      - name: Verify rollout status
        continue-on-error: true
        run: |
          kubectl rollout status deployment/prod-frontend -n techcommerce-production --timeout=5m 2>&1 || echo "Frontend rollout failed or timed out"
          kubectl rollout status deployment/prod-product-api -n techcommerce-production --timeout=5m 2>&1 || echo "Product API rollout failed or timed out"
          kubectl rollout status deployment/prod-order-api -n techcommerce-production --timeout=5m 2>&1 || echo "Order API rollout failed or timed out"

      - name: Post-deployment verification
        run: |
          echo "Running post-deployment checks..."
          echo "=== Deployments ==="
          kubectl get deployments -n techcommerce-production
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n techcommerce-production
          echo ""
          echo "=== Services ==="
          kubectl get services -n techcommerce-production

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."
          kubectl get pods -n techcommerce-production
          echo "Production smoke tests completed"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed! Rolling back..."
          kubectl rollout undo deployment/prod-frontend -n techcommerce-production || echo "No rollback needed for frontend"
          kubectl rollout undo deployment/prod-product-api -n techcommerce-production || echo "No rollback needed for product-api"
          kubectl rollout undo deployment/prod-order-api -n techcommerce-production || echo "No rollback needed for order-api"
          echo "Rollback completed"

      - name: Save production kubeconfig
        run: |
          kubectl config view --raw > production-kubeconfig.yaml

      - name: Upload production kubeconfig
        uses: actions/upload-artifact@v4
        with:
          name: production-kubeconfig
          path: production-kubeconfig.yaml
          retention-days: 1

      - name: Notify deployment
        if: always()
        run: |
          echo "Production deployment completed!"
          echo "Status: ${{ job.status }}"
          if [ "${{ job.status }}" == "failure" ]; then
            echo "Deployment failed and was rolled back"
          else
            echo "Deployment successful"
          fi
